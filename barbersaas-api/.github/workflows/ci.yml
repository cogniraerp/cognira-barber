name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbersaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barbersaas_test
      TEST_DATABASE_URL: postgresql://barbersaas_api:barbersaas_api@localhost:5432/barbersaas_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barbersaas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crear roles y BD de tests
        run: psql postgresql://postgres:postgres@localhost:5432/barbersaas -f docker/postgres/init.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - name: OpenAPI actualizado
        run: |
          cp .env.example .env
          pnpm openapi:export
          git diff --exit-code openapi.json || (echo "::error::openapi.json desactualizado: ejecuta pnpm openapi:export" && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: barbersaas-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
