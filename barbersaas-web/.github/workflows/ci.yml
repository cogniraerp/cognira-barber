name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # postinstall genera el cliente de la API desde openapi.json (versionado en este repo)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.barbersaas.com' }}
          VITE_ROOT_DOMAIN: ${{ vars.VITE_ROOT_DOMAIN || 'barbersaas.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # E2E con Playwright contra la API real. La API vive en otro repositorio: se activa definiendo la
  # variable del repo API_REPOSITORY (p. ej. "mi-org/barbersaas-api") y, si es privado, el secreto
  # API_REPO_TOKEN (token con permiso de lectura).
  e2e:
    if: ${{ vars.API_REPOSITORY != '' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY }}
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
          path: api
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            api/pnpm-lock.yaml

      - name: API (db → migraciones → api) con docker compose
        working-directory: api
        run: |
          cp .env.example .env
          # Los E2E registran usuarios y reservan varias veces seguidas desde la misma IP.
          printf 'AUTH_RATE_LIMIT_PER_MINUTE=500\nPUBLIC_BOOKINGS_PER_HOUR=500\nSEED_DEMO=false\nLOG_LEVEL=warn\n' >> .env
          docker compose --profile app up -d --build db migrate api
          for i in $(seq 1 60); do curl -sf http://localhost:3100/v1/health && break; sleep 2; done
          curl -sf http://localhost:3100/v1/health
      - name: Seed (planes por defecto + superadmin para los E2E de pagos)
        working-directory: api
        env:
          SEED_SUPERADMIN_EMAIL: e2e-admin@barbersaas.pe
          SEED_SUPERADMIN_PASSWORD: e2e-admin-1234
        run: |
          pnpm install --frozen-lockfile
          pnpm db:seed

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          VITE_API_URL: http://localhost:3100
          VITE_ROOT_DOMAIN: barbersaas.localhost
          E2E_SUPERADMIN_EMAIL: e2e-admin@barbersaas.pe
          E2E_SUPERADMIN_PASSWORD: e2e-admin-1234
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Logs de la API si algo falló
        if: failure()
        working-directory: api
        run: docker compose --profile app logs api --tail 200
