# Cognira Barber · producción en un VPS (ver deploy/README.md).
#   docker compose up -d --build        (desde deploy/, con deploy/.env completo)
name: cognira

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://barbersaas_api:${APP_DB_PASSWORD:?}@db:5432/barbersaas
  ROOT_DOMAIN: ${DOMAIN:?}
  WEB_URL: https://app.${DOMAIN}
  PUBLIC_API_URL: https://api.${DOMAIN}
  CORS_ORIGINS: https://app.${DOMAIN}
  STORAGE_LOCAL_DIR: /app/storage
  # Caddy es el único proxy delante: la IP real del cliente viene en X-Forwarded-For.
  TRUST_PROXY: "1"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: barbersaas
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barbersaas"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  # Aplica las migraciones y termina. También sirve para el seed (ver README).
  migrate:
    build: { context: ../barbersaas-api, target: deps }
    image: cognira-api-tools
    command: ["pnpm", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/barbersaas
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  api:
    build: ../barbersaas-api
    image: cognira-api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      APP_MODE: api
      PORT: "3000"
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  worker:
    build: ../barbersaas-api
    image: cognira-api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      APP_MODE: worker
    volumes:
      - storage:/app/storage
    depends_on:
      api: { condition: service_started }
    healthcheck:
      disable: true
    logging: *logging

  # Web (SPA) + proxy + HTTPS.
  caddy:
    build:
      context: ../barbersaas-web
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_ROOT_DOMAIN: ${DOMAIN}
    image: cognira-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_started }
    logging: *logging

  backup:
    build: ./backup
    image: cognira-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - backups:/backups
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
  backups:
